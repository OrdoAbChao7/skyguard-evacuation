name: CI

on:
  push:
    branches: [main, feat/skyguard-mvp-e2e]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend
        run: npm ci --prefix backend
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Backend + frontend tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Safety demo
        run: npm run demo
      - name: MVP end-to-end demo
        run: npm run demo:mvp
      - name: V6.5 prediction experiment
        run: npm run benchmark:v65 --prefix backend
      - name: Python syntax check (real-data tools)
        run: python -m py_compile backend/python/real_data/*.py backend/python/real_data/tests/*.py backend/python/ascend/*.py
      - name: Verify committed evidence manifest
        run: npx tsx backend/scripts/evidence-manifest.ts --verify
      - name: Verify evidence consistency (no benchmark reruns)
        run: npm run verify:evidence --prefix backend

  # V7.1–V7.5 基准在 44 区域汉口场景上单套约需 8–15 分钟；
  # 拆成并行矩阵作业，避免串行叠加超过单作业 20 分钟上限。
  benchmark:
    name: benchmark-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: v71
            command: npm run benchmark:v71 --prefix backend
          - suite: v72
            command: npm run benchmark:v72 --prefix backend
          - suite: v73
            command: npm run benchmark:v73 --prefix backend
          - suite: v74
            command: npm run benchmark:v74 --prefix backend
          - suite: v75
            command: npm run benchmark:v75 --prefix backend -- --only=detection,fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend
        run: npm ci --prefix backend
      - name: Run ${{ matrix.suite }} benchmarks
        run: ${{ matrix.command }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyguard-evidence-${{ matrix.suite }}
          path: evaluation/${{ matrix.suite }}
          if-no-files-found: ignore
