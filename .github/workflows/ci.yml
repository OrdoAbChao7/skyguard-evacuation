name: CI

on:
  push:
    branches: [main, feat/skyguard-mvp-e2e]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend
        run: npm ci --prefix backend
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Backend + frontend tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Safety demo
        run: npm run demo
      - name: MVP end-to-end demo
        run: npm run demo:mvp
      - name: V6.5 prediction experiment
        env:
          V65_OUTPUT_ROOT: ${{ runner.temp }}/skyguard-v65
        run: npm run benchmark:v65 --prefix backend
      - name: Python syntax check (real-data tools)
        run: python -m py_compile backend/python/real_data/*.py backend/python/real_data/tests/*.py
      - name: Verify committed evidence manifest
        run: npx tsx backend/scripts/evidence-manifest.ts --verify
      - name: Verify evidence consistency (read-only)
        run: npm run verify:evidence --prefix backend
      - name: Verify release evidence manifest
        run: npm run manifest:release --prefix backend -- --verify
      - name: Evidence must remain unchanged
        run: git diff --exit-code -- evaluation/
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: skyguard-evidence
          path: evaluation/
